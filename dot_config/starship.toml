# Optional Starship fallback, activated with WEZTERM_USE_STARSHIP=1.
# The default PowerShell/Bash prompt is custom-built so each path component
# can form a different-colored segment of the same arrow/pencil.
add_newline = false
command_timeout = 1500
format = "$shell$directory$character"

[shell]
disabled = false
format = '[ $indicator ](fg:#101321 bg:#bb9af7)'
pwsh_indicator = 'PS7'
powershell_indicator = 'PS5'
bash_indicator = 'BASH'
zsh_indicator = 'ZSH'
fish_indicator = 'FISH'
unknown_indicator = 'SHELL'

[directory]
format = '[](fg:#bb9af7 bg:#7dcfff)[ $path ](fg:#101321 bg:#7dcfff)'
truncation_length = 5
truncation_symbol = '…/'
truncate_to_repo = false
home_symbol = '~'

[character]
success_symbol = '[](fg:#7dcfff) '
error_symbol = '[](fg:#f7768e) '
vimcmd_symbol = '[](fg:#bb9af7) '
