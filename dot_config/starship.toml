# プロンプトのレイアウト定義
format = """
$directory\
$git_branch\
$git_status\
$line_break\
$character"""

# ディレクトリ表示の設定（階層ごとの色分け）
[directory]
truncation_length = 5
truncation_symbol = "…/"
style = "bold cyan"
repo_root_style = "bold purple"

# Gitブランチの表示設定
[git_branch]
symbol = "🌱 "
style = "bold green"

# 入力プロンプト記号（成功時：緑 / エラー時：赤）
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"